plugins {
    id 'com.android.application'
}

android {
    namespace 'com.achraf.tube'
    compileSdk 34

    defaultConfig {
        applicationId "com.achraf.tube"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.all {
    // kotlin-stdlib-jdk8 بقت مدمجة جوه kotlin-stdlib نفسها من إصدار 1.8 وفوق،
    // فوجودها كمكتبة منفصلة بيسبب تعارض "Duplicate class" مع بعض المكتبات
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
